<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Para Maria</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Georgia, 'Times New Roman', serif;
    background: linear-gradient(160deg, #fdf6f0 0%, #f7e8ea 50%, #f2dde3 100%);
    color: #4a3b3f;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 20px 80px;
  }
  h1 {
    font-size: 2.4em;
    font-weight: 400;
    letter-spacing: 1px;
    margin-bottom: 4px;
    color: #8a4a58;
  }
  .subtitulo {
    font-style: italic;
    color: #a97a86;
    margin-bottom: 50px;
    font-size: 1.05em;
  }
  .galeria {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 28px;
    max-width: 950px;
    margin-bottom: 55px;
  }
  .foto {
    width: 260px;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 10px 25px rgba(138, 74, 88, 0.25);
    transform: rotate(-2deg);
    transition: transform 0.3s ease;
    background: white;
    padding: 8px 8px 16px;
  }
  .foto:nth-child(2) { transform: rotate(1.5deg); }
  .foto:nth-child(3) { transform: rotate(-1deg); }
  .foto:hover { transform: rotate(0deg) scale(1.03); }
  .foto img {
    width: 100%;
    height: 300px;
    object-fit: cover;
    border-radius: 4px;
    display: block;
  }
  .mensagem {
    max-width: 620px;
    text-align: center;
    font-size: 1.15em;
    line-height: 1.9;
    color: #5c464b;
  }
  .assinatura {
    margin-top: 40px;
    font-style: italic;
    color: #8a4a58;
    font-size: 1.1em;
  }
  .coracao {
    margin-top: 30px;
    font-size: 1.6em;
    color: #c76b7a;
  }
</style>
</head>
<body>

  <h1>Para você, Maria</h1>
  <div class="subtitulo">Feliz Dia da Namorada 💌</div>

  <div class="galeria">
    <div class="foto"><img src="foto1.jpg" alt="Maria na praia"></div>
    <div class="foto"><img src="foto2.jpg" alt="Maria na formatura"></div>
    <div class="foto"><img src="foto3.png" alt="Maria com flores"></div>
  </div>

  <div class="mensagem">
    Hoje é um dia para celebrar você — o seu sorriso, a sua força e tudo o que
    construímos juntos. Cada fase, cada conquista, cada momento simples ao seu
    lado se torna especial. Obrigado por caminhar comigo.
  </div>

  <div class="assinatura">Com todo o meu amor.</div>
  <div class="coracao">♡</div>

</body>
</html>
